name: Sync Harbour events from Tixr

on:
  schedule:
    - cron: '17 9,21 * * *'   # twice daily, 09:17 and 21:17 UTC
  workflow_dispatch:           # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    # Linux, not macOS: the macOS pool is heavily queued and a scheduled run
    # was cancelled after waiting 15 minutes for a machine without running a
    # single step. Pillow replaces the macOS-only sips for poster resizing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Pillow (poster resizing)
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Pull events and regenerate listings
        env:
          TIXR_GROUP_HARBOUR: '2543'
          TIXR_CPK_HARBOUR: ${{ secrets.TIXR_CPK_HARBOUR }}
          TIXR_SECRET_HARBOUR: ${{ secrets.TIXR_SECRET_HARBOUR }}
          TIXR_GROUP_LIVE: '3091'
          TIXR_CPK_LIVE: ${{ secrets.TIXR_CPK_LIVE }}
          TIXR_SECRET_LIVE: ${{ secrets.TIXR_SECRET_LIVE }}
          TIXR_GROUP_HALO: '2714'
          TIXR_CPK_HALO: ${{ secrets.TIXR_CPK_HALO }}
          TIXR_SECRET_HALO: ${{ secrets.TIXR_SECRET_HALO }}
        run: python3 tools/sync-events.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change — listings already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html index.html content/events-harbour.json images/events
          git commit -m "Sync Harbour events from Tixr"
          git push
