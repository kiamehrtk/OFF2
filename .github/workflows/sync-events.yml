name: Sync Harbour events from Tixr

on:
  schedule:
    - cron: '17 9,21 * * *'   # twice daily, 09:17 and 21:17 UTC
  workflow_dispatch:           # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-latest      # sips, used to downsize the posters
    steps:
      - uses: actions/checkout@v4

      - name: Pull events and regenerate listings
        env:
          TIXR_GROUP_HARBOUR: '2543'
          TIXR_CPK_HARBOUR: ${{ secrets.TIXR_CPK_HARBOUR }}
          TIXR_SECRET_HARBOUR: ${{ secrets.TIXR_SECRET_HARBOUR }}
          TIXR_GROUP_LIVE: '3091'
          TIXR_CPK_LIVE: ${{ secrets.TIXR_CPK_LIVE }}
          TIXR_SECRET_LIVE: ${{ secrets.TIXR_SECRET_LIVE }}
        run: python3 tools/sync-events.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change — listings already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html index.html content/events-harbour.json images/events
          git commit -m "Sync Harbour events from Tixr"
          git push
